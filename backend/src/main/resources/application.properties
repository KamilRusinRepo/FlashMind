spring.application.name=backend
springdoc.paths-to-match=/api/**
springdoc.override-with-generic-response=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.with-credentials=true
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.validator-url=none
app.statistics.zone=Europe/Warsaw
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.sql.init.mode=never
spring.datasource.hikari.connection-timeout=3000
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=30m
app.tokens.email-verification-ttl=24h
app.tokens.password-reset-ttl=30m
app.mail.from=no-reply@flashmind.local
app.mail.verification-url=http://localhost:3000/verify-email
app.mail.password-reset-url=http://localhost:3000/reset-password
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
spring.rabbitmq.connection-timeout=3s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
app.reminders.enabled=true
app.reminders.send-hour=18
app.reminders.zone=Europe/Warsaw
app.reminders.poll-delay-ms=300000

